name: Build HikVisionTV APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: unzip -o HikVisionTV_Source_v1.0.zip

      - name: Build debug APK
        working-directory: HikVisionTV
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p artifact
          cp HikVisionTV/app/build/outputs/apk/debug/app-debug.apk artifact/HikVisionTV_v1.0_debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HikVisionTV-APK
          path: artifact/HikVisionTV_v1.0_debug.apk
          if-no-files-found: error
